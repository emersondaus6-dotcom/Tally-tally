<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikaw Tally an ko</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #111318;
            color: #ffffff;
        }

        header {
            background-color: rgba(17, 19, 24, 0.9);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2f3d;
            z-index: 10;
        }

        .week-info {
            font-size: 0.9rem;
            color: #9ca3af;
        }

        .manual-reset-btn {
            background: transparent;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .manual-reset-btn:hover {
            color: #ffffff;
            border-color: #6b7280;
        }

        .split-container {
            display: flex;
            flex: 1;
            width: 100%;
        }

        .side {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.3s ease;
        }

        /* =========================================================
           INSERT YOUR 2 BACKGROUND PICTURES HERE
           Replace the URLs inside url('...') with your image paths
           ========================================================= */
        .left-side {
            background-color: #1a1f2c;
            background-image: url('45f4a8c4-7705-452b-8a26-82a4a71770fc.jpg');
            border-right: 2px solid #2a2f3d;
        }

        .right-side {
            background-color: #1f1a24;
            background-image: url('98a416a8-ad56-486c-87a5-68df2de8ae93.jpg');
        }

        .side::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(15, 17, 23, 0.55);
            z-index: 1;
        }

        .side-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 1.5rem;
            border-radius: 16px;
            background: rgba(20, 23, 31, 0.45);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .side-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #f3f4f6;
        }

        .tally-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2.2rem;
            height: 180px;
            width: 100%;
        }

        .tally-line {
            width: 16px;
            height: 150px;
            background-color: #f8fafc;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.35);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }

        .left-side .tally-line {
            background-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.45);
        }

        .right-side .tally-line {
            background-color: #fb7185;
            box-shadow: 0 0 20px rgba(251, 113, 133, 0.45);
        }

        .tally-line.spent {
            opacity: 0.12;
            transform: scaleY(0.75);
            box-shadow: none;
        }

        .decrement-btn {
            font-size: 1.5rem;
            font-weight: 800;
            padding: 0.9rem 2.8rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #ffffff;
            background-color: #2563eb;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            transition: transform 0.1s ease, background-color 0.2s ease, opacity 0.2s ease;
        }

        .left-side .decrement-btn {
            background-color: #0284c7;
        }

        .left-side .decrement-btn:hover:not(:disabled) {
            background-color: #0369a1;
        }

        .right-side .decrement-btn {
            background-color: #e11d48;
        }

        .right-side .decrement-btn:hover:not(:disabled) {
            background-color: #be123c;
        }

        .decrement-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .decrement-btn:disabled {
            background-color: #374151;
            color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
        }

        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
            }
            .left-side {
                border-right: none;
                border-bottom: 2px solid #2a2f3d;
            }
            .tally-line {
                height: 110px;
                width: 14px;
            }
            .tally-box {
                height: 130px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="week-info" id="reset-status">Connecting to Firebase...</div>
        <button class="manual-reset-btn" id="reset-btn">Reset Now</button>
    </header>

    <main class="split-container">
        <section class="side left-side">
            <div class="side-content">
                <h2 class="side-title">Esson</h2>
                <div class="tally-box" id="left-tallies">
                    <div class="tally-line"></div>
                    <div class="tally-line"></div>
                    <div class="tally-line"></div>
                </div>
                <button class="decrement-btn" id="left-btn">-1</button>
            </div>
        </section>

        <section class="side right-side">
            <div class="side-content">
                <h2 class="side-title">Je</h2>
                <div class="tally-box" id="right-tallies">
                    <div class="tally-line"></div>
                    <div class="tally-line"></div>
                    <div class="tally-line"></div>
                </div>
                <button class="decrement-btn" id="right-btn">-1</button>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBj3ZV21X--6fKxWFOSMRa98-h53CGBKYI",
            authDomain: "tally-tally-an.firebaseapp.com",
            databaseURL: "https://tally-tally-an-default-rtdb.firebaseio.com",
            projectId: "tally-tally-an",
            storageBucket: "tally-tally-an.firebasestorage.app",
            messagingSenderId: "967387456313",
            appId: "1:967387456313:web:110e5f7aaba2a16bd03ee8",
            measurementId: "G-Y7FKYZJJLY"
        };

        const MAX_TALLIES = 3;
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const tallyRef = ref(db, "sharedTally/current");

        let currentState = {
            weekStart: getStartOfCurrentWeek(),
            left: MAX_TALLIES,
            right: MAX_TALLIES
        };

        function getStartOfCurrentWeek() {
            const now = new Date();
            const day = now.getDay();
            const diffToMonday = (day === 0 ? -6 : 1 - day);
            const monday = new Date(now);
            monday.setDate(now.getDate() + diffToMonday);
            monday.setHours(0, 0, 0, 0);
            return monday.getTime();
        }

        function getFreshWeekState(weekStart = getStartOfCurrentWeek()) {
            return {
                weekStart,
                left: MAX_TALLIES,
                right: MAX_TALLIES
            };
        }

        function render(state) {
            ["left", "right"].forEach(side => {
                const container = document.getElementById(`${side}-tallies`);
                const lines = container.querySelectorAll(".tally-line");
                const btn = document.getElementById(`${side}-btn`);
                const count = typeof state[side] === "number" ? state[side] : MAX_TALLIES;

                lines.forEach((line, index) => {
                    if (index < count) {
                        line.classList.remove("spent");
                    } else {
                        line.classList.add("spent");
                    }
                });

                btn.disabled = count <= 0;
            });

            const nextMonday = new Date(state.weekStart + 7 * 24 * 60 * 60 * 1000);
            document.getElementById("reset-status").textContent =
                `Synced • Next auto-reset: ${nextMonday.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}`;
        }

        function writeState(nextState) {
            currentState = nextState;
            render(currentState);
            set(tallyRef, nextState).catch(err => {
                console.error("Firebase write failed:", err);
                document.getElementById("reset-status").textContent = "Sync error — check Firebase config/rules";
            });
        }

        function decrement(side) {
            const thisWeek = getStartOfCurrentWeek();
            if (currentState.weekStart !== thisWeek) {
                const resetState = getFreshWeekState(thisWeek);
                resetState[side] = Math.max(0, MAX_TALLIES - 1);
                writeState(resetState);
                return;
            }

            if (currentState[side] > 0) {
                writeState({
                    ...currentState,
                    [side]: currentState[side] - 1
                });
            }
        }

        function forceReset() {
            writeState(getFreshWeekState(getStartOfCurrentWeek()));
        }

        document.getElementById("left-btn").addEventListener("click", () => decrement("left"));
        document.getElementById("right-btn").addEventListener("click", () => decrement("right"));
        document.getElementById("reset-btn").addEventListener("click", forceReset);

        onValue(tallyRef, (snapshot) => {
            const thisWeek = getStartOfCurrentWeek();

            if (!snapshot.exists()) {
                writeState(getFreshWeekState(thisWeek));
                return;
            }

            const data = snapshot.val();
            if (data.weekStart !== thisWeek) {
                writeState(getFreshWeekState(thisWeek));
                return;
            }

            currentState = {
                weekStart: data.weekStart,
                left: typeof data.left === "number" ? data.left : MAX_TALLIES,
                right: typeof data.right === "number" ? data.right : MAX_TALLIES
            };
            render(currentState);
        }, (error) => {
            console.error("Firebase read failed:", error);
            document.getElementById("reset-status").textContent = "Failed to load database — check rules";
        });

        setInterval(() => {
            if (currentState.weekStart !== getStartOfCurrentWeek()) {
                forceReset();
            }
        }, 60000);
    </script>
</body>
</html>
